apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pearl-demo
  namespace: scroll-world
  annotations:
    # Adjust for your ingress controller (nginx/traefik on k3s).
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: pearl.scroll-world.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pearl-demo
                port:
                  number: 80
