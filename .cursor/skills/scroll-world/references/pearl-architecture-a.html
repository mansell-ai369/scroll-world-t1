<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>珍丸茶室 Pearl &amp; Co. — 由茶園到最後一啖</title>
  <meta name="description" content="碌落去，飛入珍丸茶室嘅微縮世界 — 由茶園、珍珠工坊、旗艦茶室到外送車隊，一鏡到尾。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* Theme the engine: matches the generated scenes' background + brand palette. */
    :root, .sw-root {
      --sw-bg: #F5EDE0;          /* == the scene background colour */
      --sw-ink: #3A2E48;         /* deep plum */
      --sw-ink-soft: #7A6C85;
      --sw-accent: #C88A5A;      /* caramel — per-section accents override at runtime */
      --sw-font-display: 'Noto Serif TC', 'Songti TC', serif;
      --sw-font-body: 'Noto Sans TC', 'PingFang TC', sans-serif;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>
  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: '珍丸茶室 Pearl & Co.', href: '#top' },
      cta: { label: '立即叫茶', href: '#finale' },
      hint: '碌落去 · 飛入嚟',
      diveScroll: 1.3,
      crossfade: 0.12,
      sections: [
        {
          id: 'farm', label: '茶園',
          still: 'assets/farm.webp',
          clip: 'assets/vid/farm.mp4',
          clipMobile: 'assets/vid/farm-m.mp4',
          accent: '#8FB98A', scroll: 1.5, linger: 0.35,
          eyebrow: 'FROM LEAF TO LAST SIP',
          title: '一切，由山頭開始。',
          body: '清晨手採嘅高山茶葉，係每一杯嘅起點。',
          tags: ['高山茶葉', '每日新鮮', '手採'],
        },
        {
          id: 'kitchen', label: '珍珠工坊',
          still: 'assets/kitchen.webp',
          clip: 'assets/vid/kitchen.mp4',
          clipMobile: 'assets/vid/kitchen-m.mp4',
          accent: '#C88A5A',
          eyebrow: 'THE PEARL KITCHEN',
          title: '每粒珍珠都有火喉。',
          body: '黑糖慢火熬煮，先至有嗰啖煙韌。',
          tags: ['黑糖慢煮', '即日現製'],
        },
        {
          id: 'shop', label: '旗艦茶室',
          still: 'assets/shop.webp',
          clip: 'assets/vid/shop.mp4',
          clipMobile: 'assets/vid/shop-m.mp4',
          accent: '#9B7EBD',
          eyebrow: 'THE FLAGSHIP',
          title: '沖茶，係一門手藝。',
          body: '每一杯都即叫即搖，茶湯先至夠挺身。',
          tags: ['即叫即製', '冠軍茶方'],
        },
        {
          id: 'delivery', label: '外送',
          still: 'assets/delivery.webp',
          clip: 'assets/vid/delivery.mp4',
          clipMobile: 'assets/vid/delivery-m.mp4',
          accent: '#7EA6C9',
          eyebrow: 'TO YOUR DOOR',
          title: '凍飲，送到你手。',
          body: '保溫袋密密實實，冰度啱啱好送到。',
          tags: ['30 分鐘送達', '保冷配送'],
        },
        {
          id: 'finale', label: '招牌',
          still: 'assets/finale.webp',
          clip: 'assets/vid/finale.mp4',
          clipMobile: 'assets/vid/finale-m.mp4',
          accent: '#9B7EBD', scroll: 1.6, linger: 0.45,
          eyebrow: 'AND IT ALL POURS INTO',
          title: '一啖，圓滿。',
          body: '由一片葉到一粒珍珠，全部喺晒呢杯度。',
          tags: [],
          cta: { primary: { label: '立即叫茶', href: '#' },
                 secondary: { label: '睇吓餐單', href: '#' } },
        },
      ],
      // Architecture A: the legs ARE the journey — each leg starts from the
      // previous leg's actual last frame, so no connector clips are needed.
      connectors: [],
    });
  </script>
</body>
</html>
